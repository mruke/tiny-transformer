project:
  name: "tiny-transformer"
  version: "0.1.0"
  seed: 42

data:
  dataset_path: "data/input.txt"
  train_split_ratio: 0.9
  context_window: 128
  encoding: "utf-8"

model:
  vocab_size: null
  max_sequence_length: 128
  embedding_dim: 128
  num_heads: 4
  num_layers: 2
  feedforward_dim: 512
  dropout_rate: 0.1

training:
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0
  max_epochs: 10
  device: "cpu"
  eval_interval: 100
  log_interval: 10

generation:
  max_new_tokens: 100
  temperature: 1.0
  top_k: null

logging:
  log_level: "INFO"

checkpointing:
  output_dir: "outputs/checkpoints"
  save_every_n_epochs: 1
  checkpoint_name_prefix: "tiny_transformer"